services:
  postgres:
    image: postgres:16-alpine
    container_name: warmindo_db_container
    restart: always
    environment:
      POSTGRES_USER: warmindo_admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: warmindo_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: